name: nightly

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.prep.outputs.commit }}
      sha: ${{ steps.prep.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: prep
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q mojo-compiler
          /tmp/venv/bin/mojo build -I . patch_kicad.mojo -o /tmp/patch_kicad
          /tmp/venv/bin/mojo build -I . test_kicad_panels.mojo -o /tmp/test_kicad_panels
          git clone --depth 1 https://gitlab.com/kicad/code/kicad.git /tmp/kicad
          /tmp/test_kicad_panels /tmp/kicad "$GITHUB_WORKSPACE"
          /tmp/patch_kicad --apply /tmp/kicad "$GITHUB_WORKSPACE"
          echo "commit=$(git -C /tmp/kicad rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C /tmp/kicad rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          git -C /tmp/kicad add -N pcbnew/widgets/panel_plugin_host.h pcbnew/widgets/panel_plugin_host.cpp
          git -C /tmp/kicad diff --binary > /tmp/kicad-panels-nightly.patch
      - uses: actions/upload-artifact@v4
        with:
          name: patch
          path: /tmp/kicad-panels-nightly.patch

  linux:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.gitlab.com/kicad/kicad-ci/source_containers/master/fedora:41
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: artifact
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-
      - run: |
          command -v glslangValidator >/dev/null 2>&1 || dnf install -y glslang spirv-tools vulkan-headers
          command -v xz >/dev/null 2>&1 || dnf install -y xz
          export CCACHE_DIR="$PWD/.ccache"
          git init /tmp/kicad
          git -C /tmp/kicad fetch --depth 1 https://gitlab.com/kicad/code/kicad.git ${{ needs.patch.outputs.commit }}
          git -C /tmp/kicad checkout FETCH_HEAD
          git -C /tmp/kicad apply "$PWD/artifact/kicad-panels-nightly.patch"
          cmake -S /tmp/kicad -B /tmp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_USE_CMAKE_FINDPROTOBUF=ON \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_INSTALL_DEMOS=OFF \
            -DKICAD_BUILD_NATIVE_MODEL_PREVIEW=OFF \
            -DKICAD_VERSION_EXTRA=panels
          cmake --build /tmp/build
          DESTDIR=/tmp/pkg cmake --install /tmp/build
          rm -rf /tmp/build /tmp/kicad
          mkdir -p dist
          tar -C /tmp/pkg/usr/local -cJf dist/kicad-panels-nightly-linux-x86_64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/kicad-panels-nightly-linux-x86_64.tar.xz

  macos:
    needs: patch
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: artifact
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-
      - run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v cmake >/dev/null 2>&1 || brew install cmake
          brew install ninja pkgconf ccache wxwidgets opencascade boost cairo pixman glm libgit2 sqlite freetype harfbuzz fontconfig libngspice protobuf abseil unixodbc zstd libpng jpeg-turbo glew glslang spirv-tools spirv-cross
          curl -fsSL https://github.com/nanomsg/nng/archive/refs/tags/v1.11.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/nng-1.11" -B "$RUNNER_TEMP/nng-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DNNG_TESTS=OFF \
            -DNNG_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/deps" \
            -DCMAKE_INSTALL_NAME_DIR="$RUNNER_TEMP/deps/lib"
          cmake --build "$RUNNER_TEMP/nng-build"
          cmake --install "$RUNNER_TEMP/nng-build"
          export CCACHE_DIR="$PWD/.ccache"
          BREW_PREFIX="$(brew --prefix)"
          git init "$RUNNER_TEMP/kicad"
          git -C "$RUNNER_TEMP/kicad" fetch --depth 1 https://gitlab.com/kicad/code/kicad.git ${{ needs.patch.outputs.commit }}
          git -C "$RUNNER_TEMP/kicad" checkout FETCH_HEAD
          git -C "$RUNNER_TEMP/kicad" apply "$PWD/artifact/kicad-panels-nightly.patch"
          cmake -S "$RUNNER_TEMP/kicad" -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OBJCXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/deps" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pkg" \
            -DSQLite3_ROOT="$BREW_PREFIX/opt/sqlite" \
            -DOCC_INCLUDE_DIR="$BREW_PREFIX/opt/opencascade/include/opencascade" \
            -DOCC_LIBRARY_DIR="$BREW_PREFIX/opt/opencascade/lib" \
            -DNGSPICE_INCLUDE_DIR="$BREW_PREFIX/opt/libngspice/include" \
            -DNGSPICE_LIBRARY="$BREW_PREFIX/opt/libngspice/lib/libngspice.dylib" \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_INSTALL_DEMOS=OFF \
            -DKICAD_BUILD_NATIVE_MODEL_PREVIEW=OFF \
            -DKICAD_VERSION_EXTRA=panels
          cmake --build "$RUNNER_TEMP/build"
          cmake --install "$RUNNER_TEMP/build"
          rm -rf "$RUNNER_TEMP/build" "$RUNNER_TEMP/kicad"
          mkdir -p dist
          tar -C "$RUNNER_TEMP/pkg" -cJf dist/kicad-panels-nightly-macos-arm64.tar.xz KiCad.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/kicad-panels-nightly-macos-arm64.tar.xz

  freebsd:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KICAD_COMMIT: ${{ needs.patch.outputs.commit }}
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: artifact
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-freebsd-${{ github.run_id }}
          restore-keys: ccache-freebsd-
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          mem: '12288'
          cpu: '4'
          envs: 'KICAD_COMMIT'
          prepare: |
            pkg install -y git cmake-core ninja ccache pkgconf python3 gettext-tools glm wx32-gtk3 boost-libs opencascade ngspice_rework-shlib protobuf abseil nng1 sqlite3 unixODBC libgit2 curl cairo pixman harfbuzz fontconfig freetype2 png jpeg-turbo zstd poppler-glib libsecret wayland libspnav gtk3 mesa-libs libGLU libX11 libXext libICE libxcb glslang spirv-tools vulkan-headers
            pkg clean -ay
          run: |
            export CCACHE_DIR="$PWD/.ccache"
            git init /tmp/kicad
            git -C /tmp/kicad fetch --depth 1 https://gitlab.com/kicad/code/kicad.git "$KICAD_COMMIT"
            git -C /tmp/kicad checkout FETCH_HEAD
            git -C /tmp/kicad apply "$PWD/artifact/kicad-panels-nightly.patch"
            git clone --depth 1 --filter=blob:none --sparse https://git.freebsd.org/ports.git /tmp/ports
            git -C /tmp/ports sparse-checkout set cad/kicad-devel/files
            for p in /tmp/ports/cad/kicad-devel/files/patch-*; do
              patch -d /tmp/kicad -p0 -N -s < "$p" || true
            done
            cmake -S /tmp/kicad -B /tmp/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_FLAGS="-D_LIBCPP_ENABLE_EXPERIMENTAL -DBOOST_STACKTRACE_GNU_SOURCE_NOT_REQUIRED" \
              -DCMAKE_INCLUDE_PATH="/tmp/kicad/include;/usr/local/include" \
              -DwxWidgets_CONFIG_EXECUTABLE=/usr/local/bin/wxgtk3u-3.2-config \
              -DOCC_INCLUDE_DIR=/usr/local/include/OpenCASCADE \
              -DKICAD_BUILD_QA_TESTS=OFF \
              -DKICAD_INSTALL_DEMOS=OFF \
              -DKICAD_BUILD_NATIVE_MODEL_PREVIEW=OFF \
              -DKICAD_VERSION_EXTRA=panels
            cmake --build /tmp/build
            DESTDIR=/tmp/pkg cmake --install /tmp/build
            rm -rf /tmp/build /tmp/kicad /tmp/ports
            mkdir -p dist
            tar -C /tmp/pkg/usr/local -cJf dist/kicad-panels-nightly-freebsd-x86_64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: dist/kicad-panels-nightly-freebsd-x86_64.tar.xz

  release:
    needs: [patch, linux, macos, freebsd]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/release
          merge-multiple: true
      - run: |
          test -s /tmp/release/kicad-panels-nightly-macos-arm64.tar.xz
          test -s /tmp/release/kicad-panels-nightly-linux-x86_64.tar.xz
          test -s /tmp/release/kicad-panels-nightly-freebsd-x86_64.tar.xz
          test -s /tmp/release/kicad-panels-nightly.patch
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly \
            /tmp/release/kicad-panels-nightly-macos-arm64.tar.xz \
            /tmp/release/kicad-panels-nightly-linux-x86_64.tar.xz \
            /tmp/release/kicad-panels-nightly-freebsd-x86_64.tar.xz \
            /tmp/release/kicad-panels-nightly.patch \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly (KiCad ${{ needs.patch.outputs.sha }})" \
            --notes "Patched KiCad nightly (${{ needs.patch.outputs.commit }}) verified to compile on macOS, Linux, and FreeBSD."
